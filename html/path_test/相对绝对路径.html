<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>相对绝对路径</title>
</head>
<body>
     <!-- 相对路径是相对于当前文件所在的目录而言的，绝对路径是相对于网站根目录而言的 -->
     <!-- 相对路径的写法是：./表示当前目录，../表示上一级目录 -->
     <!-- 绝对路径的写法是：/表示网站根目录 -->
    <!-- 
        <img src="xueruioruo1.jpg" alt="薛若若的画" width="500" >
        <img src="./xueruioruo1.jpg" alt="薛若若的画" width="500" >
        <img src="./a/xueruoruo2.jpg" alt="薛若若的画" width="500" >
        <img src="../薛若若的画.jpg" alt="薛若若的画" width="500" >
    -->
    <!-- 绝对路径分为两类：本地绝对路径，网络绝对路径 -->  
       
</body>
</html>
