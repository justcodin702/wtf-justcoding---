<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>超链接跳转文件</title>
</head>
<body>
    <!-- 浏览器可直接打开部图片，视频，gif和pdf等，可以打开时默认点击自动打开跳转 -->
    <a href="./path_test/xueruioruo1.jpg" target="_blank">薛若若的画</a>
    <!-- 遇到需要打开文件但是无法正常打开时默认重新下载，而不是打开 -->
    <!-- 强制触发下载见以下，download后是保存文件的名字-->
     <a href="./path_test/xueruioruo1.jpg" download="xueruoruo">下载薛若若的画</a>
</body>
</html>
