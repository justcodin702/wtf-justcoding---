<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>常用的文本标签</title>
</head>
<body>
    <!-- 文本标签用于包裹词汇或者短语，通常写在排版标签内部 -->
    <!--
    排版标签更加宏观，是大段文字的包装，而文本标签更加微观，
    是单个词汇或短语的包装 
    <strong>更加强调的着重，十分重要</strong>
    <em>需要着重阅读的内容，比strong更弱</em>
    span是短语包装袋，可以理解为将要处理的文字包裹，作为选中待处理状态
    div同理，但是是块级元素，通常用来包裹文本块，但作用和span类似
    -->
     <p>
       接下来的文字我将会使用<em>强调标签</em>
     </p>
     <p>
        出门时要<strong>关好门窗</strong>
     </p>
</body>
</html>
